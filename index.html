<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cursor Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { opacity: 0.9; margin-bottom: 1.5rem; }
    button {
      padding: 0.6rem 1.4rem;
      border: none;
      border-radius: 8px;
      background: #fff;
      color: #764ba2;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    button:hover { transform: scale(1.05); }
    #msg { margin-top: 1rem; font-size: 0.95rem; min-height: 1.4em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, Cursor!</h1>
    <p>这是一个简单的测试页面，来自 Cursor_Test 仓库。</p>
    <button type="button" id="btn">点我一下</button>
    <p id="msg"></p>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', () => {
      document.getElementById('msg').textContent =
        '你好！当前时间：' + new Date().toLocaleString('zh-CN');
    });
  </script>
</body>
</html>
